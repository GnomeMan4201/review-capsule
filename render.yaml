# Synthetic demo only. References the existing database in My Workspace.
services:
  - type: web
    name: review-capsule-demo
    runtime: docker
    plan: free
    region: virginia
    repo: https://github.com/GnomeMan4201/review-capsule
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: "off"
    healthCheckPath: /healthz/
    envVars:
      - key: CAPSULE_DEBUG
        value: "0"
      - key: CAPSULE_SYNTHETIC_DEMO
        value: "1"
      - key: CAPSULE_SECRET_KEY
        generateValue: true
      - key: CAPSULE_DEMO_PASSWORD
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: review-capsule-demo-db
          property: connectionString
