name: Read-only OTS calendar diagnostics
on:
  push:
    branches: ['evidence/ots-synthetic-2026-11-01']
    paths:
      - '.github/workflows/ots-calendar-diagnostics.yml'
      - 'reviewrecord/tools/ots_calendar_diagnostics.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ots-synthetic-2026-11-01
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: evidence/ots-synthetic-2026-11-01
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install opentimestamps-client==0.8.0
      - name: Record ots info and exact read-only calendar HTTP results
        run: |
          python reviewrecord/tools/ots_calendar_diagnostics.py \
            --root reviewrecord/evidence/ots-synthetic-2026-11-01 \
            --output reviewrecord/evidence/ots-synthetic-2026-11-01/calendar-diagnostics/${{ github.run_id }}-${{ github.run_attempt }}/results.json \
            --query-calendars
      - name: Commit diagnostic output only
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- reviewrecord/evidence/ots-synthetic-2026-11-01/calendar-diagnostics
          if ! git diff --cached --quiet; then
            git commit -m 'Retain read-only OTS routing diagnostics and exact ots info output'
            git push origin HEAD:refs/heads/evidence/ots-synthetic-2026-11-01
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ots-calendar-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: reviewrecord/evidence/ots-synthetic-2026-11-01/calendar-diagnostics/
