name: Synthetic explorer and matching TSA evidence
on:
  push:
    branches: ['evidence/ots-synthetic-2026-11-01']
    paths:
      - '.github/workflows/anchor-demo-evidence.yml'
      - 'reviewrecord/tools/anchor_demo_evidence.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ots-synthetic-2026-11-01
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: evidence/ots-synthetic-2026-11-01
      - uses: actions/checkout@v4
        with:
          ref: d54432f3e4c67f11ea53c16ebb383c1aec1f9224
          path: pinned-verifier
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ./pinned-verifier/reviewrecord
      - name: Compare two explorer APIs and request real nonce-bearing TSA tokens
        run: |
          python reviewrecord/tools/anchor_demo_evidence.py \
            --root reviewrecord/evidence/ots-synthetic-2026-11-01 \
            --source pinned-verifier/reviewrecord \
            --output reviewrecord/evidence/ots-synthetic-2026-11-01/external-demo/${{ github.run_id }}-${{ github.run_attempt }}
      - name: Retain synthetic evidence only
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- reviewrecord/evidence/ots-synthetic-2026-11-01/external-demo
          if ! git diff --cached --quiet; then
            git commit -m 'Retain explorer-only comparison and real matching synthetic TSA responses'
            git push origin HEAD:refs/heads/evidence/ots-synthetic-2026-11-01
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-anchor-demo-${{ github.run_id }}-${{ github.run_attempt }}
          path: reviewrecord/evidence/ots-synthetic-2026-11-01/external-demo/
