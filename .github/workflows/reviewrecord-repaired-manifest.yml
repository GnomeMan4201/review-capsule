name: Review Record repaired-manifest experiment (separate observations)
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  repaired-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ./reviewrecord
      - name: Mocked-anchor comparison with baseline and missing-reveal negative control
        run: python reviewrecord/experiments/external_concerns/repaired_manifest_probe.py --write repaired-manifest-rerun.json
      - name: Compare rerun with retained experimental results (not coverage)
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          retained = json.loads(Path('reviewrecord/evidence/repaired-manifest-2026-11-03/results.json').read_text())
          rerun = json.loads(Path('repaired-manifest-rerun.json').read_text())
          assert rerun == retained, 'Experimental result differs; inspect artifact'
          print('84 paired experimental observations match retained results; no coverage claim')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repaired-manifest-experimental-results
          path: repaired-manifest-rerun.json
